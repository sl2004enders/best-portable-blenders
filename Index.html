<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>ZYNTRA AI — Automate Your Business</title>
<meta name="description" content="ZYNTRA AI installs AI systems that answer customers, book appointments, and follow up leads — 24/7, fully automated.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Instrument+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #04040a;
  --surface: #0c0c18;
  --surface2: #11111f;
  --border: #1e1e35;
  --accent: #00f0ff;
  --accent2: #7b2fff;
  --text: #f0f0ff;
  --muted: #6b6b8a;
  --white: #ffffff;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; font-size: 16px; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Instrument Sans', sans-serif;
  line-height: 1.6;
  overflow-x: hidden;
}

a { text-decoration: none; color: inherit; }

/* ── GRID BG ── */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image:
    linear-gradient(rgba(0,240,255,0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,240,255,0.03) 1px, transparent 1px);
  background-size: 60px 60px;
  pointer-events: none;
  z-index: 0;
}

/* ── GLOW ORBS ── */
.orb {
  position: fixed;
  border-radius: 50%;
  filter: blur(80px);
  pointer-events: none;
  z-index: 0;
}
.orb1 { width: 500px; height: 500px; background: rgba(123,47,255,0.12); top: -150px; right: -150px; }
.orb2 { width: 400px; height: 400px; background: rgba(0,240,255,0.07); bottom: 10%; left: -100px; }

/* ── NAV ── */
nav {
  position: fixed; top: 0; left: 0; right: 0;
  z-index: 1000;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 18px 32px;
  background: rgba(4,4,10,0.85);
  backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--border);
}

.logo {
  font-family: 'Syne', sans-serif;
  font-weight: 800;
  font-size: 20px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}
.logo span {
  background: linear-gradient(90deg, var(--accent), var(--accent2));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

.nav-links {
  display: flex;
  gap: 28px;
  align-items: center;
}

.nav-links a {
  font-size: 13px;
  font-weight: 500;
  letter-spacing: 0.06em;
  color: var(--muted);
  transition: color 0.2s;
}
.nav-links a:hover { color: var(--accent); }

.nav-cta {
  background: var(--accent);
  color: #000 !important;
  padding: 10px 22px;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  border-radius: 2px;
  transition: box-shadow 0.2s, transform 0.2s;
}
.nav-cta:hover {
  box-shadow: 0 0 20px rgba(0,240,255,0.4);
  transform: translateY(-1px);
}

@media (max-width: 600px) {
  nav { padding: 16px 20px; }
  .nav-links a:not(.nav-cta) { display: none; }
}

/* ── HERO ── */
.hero {
  position: relative;
  z-index: 1;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: flex-start;
  padding: 120px 32px 80px;
  max-width: 900px;
  margin: 0 auto;
}

.hero-badge {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: rgba(0,240,255,0.07);
  border: 1px solid rgba(0,240,255,0.2);
  padding: 6px 14px;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--accent);
  margin-bottom: 28px;
  border-radius: 2px;
  opacity: 0;
  animation: fadeUp 0.6s 0.1s forwards;
}

.hero-badge::before {
  content: '';
  width: 6px; height: 6px;
  background: var(--accent);
  border-radius: 50%;
  animation: pulse 2s infinite;
}

@keyframes pulse {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.4; transform: scale(0.8); }
}

.hero h1 {
  font-family: 'Syne', sans-serif;
  font-size: clamp(42px, 10vw, 96px);
  font-weight: 800;
  line-height: 0.95;
  letter-spacing: -0.03em;
  margin-bottom: 28px;
  opacity: 0;
  animation: fadeUp 0.7s 0.2s forwards;
}

.hero h1 .glow {
  background: linear-gradient(90deg, var(--accent), var(--accent2));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  display: block;
}

.hero-sub {
  font-size: clamp(15px, 2.5vw, 19px);
  font-weight: 300;
  color: var(--muted);
  max-width: 520px;
  margin-bottom: 40px;
  line-height: 1.75;
  opacity: 0;
  animation: fadeUp 0.7s 0.35s forwards;
}

.hero-actions {
  display: flex;
  gap: 14px;
  flex-wrap: wrap;
  opacity: 0;
  animation: fadeUp 0.7s 0.5s forwards;
}

.btn-primary {
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  color: #000;
  padding: 15px 30px;
  font-family: 'Syne', sans-serif;
  font-weight: 700;
  font-size: 13px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  border: none;
  border-radius: 2px;
  display: inline-flex;
  align-items: center;
  gap: 10px;
  transition: transform 0.2s, box-shadow 0.2s;
}
.btn-primary:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 28px rgba(0,240,255,0.3);
}

.btn-ghost {
  background: transparent;
  color: var(--text);
  padding: 15px 30px;
  font-family: 'Syne', sans-serif;
  font-weight: 700;
  font-size: 13px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  border: 1px solid var(--border);
  border-radius: 2px;
  display: inline-flex;
  align-items: center;
  gap: 10px;
  transition: border-color 0.2s, background 0.2s;
}
.btn-ghost:hover { border-color: var(--accent); background: rgba(0,240,255,0.04); }

/* STATS ROW */
.hero-stats {
  display: flex;
  gap: 40px;
  flex-wrap: wrap;
  margin-top: 56px;
  padding-top: 40px;
  border-top: 1px solid var(--border);
  opacity: 0;
  animation: fadeUp 0.7s 0.65s forwards;
}

.stat strong {
  display: block;
  font-family: 'Syne', sans-serif;
  font-size: clamp(26px, 5vw, 36px);
  font-weight: 800;
  letter-spacing: -0.03em;
  background: linear-gradient(90deg, var(--accent), var(--accent2));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}
.stat span {
  font-size: 11px;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.12em;
}

/* ── MARQUEE ── */
.marquee-wrap {
  position: relative;
  z-index: 1;
  border-top: 1px solid var(--border);
  border-bottom: 1px solid var(--border);
  background: var(--surface);
  padding: 14px 0;
  overflow: hidden;
}

.marquee-track {
  display: flex;
  gap: 48px;
  animation: marquee 22s linear infinite;
  width: max-content;
}

.marquee-item {
  display: flex;
  align-items: center;
  gap: 10px;
  font-family: 'Syne', sans-serif;
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--muted);
  white-space: nowrap;
}
.marquee-item .dot { color: var(--accent); font-size: 18px; }

@keyframes marquee {
  from { transform: translateX(0); }
  to { transform: translateX(-50%); }
}

/* ── SECTIONS ── */
.section {
  position: relative;
  z-index: 1;
  max-width: 1080px;
  margin: 0 auto;
  padding: 90px 32px;
}

@media (max-width: 600px) { .section { padding: 70px 20px; } }

.section-label {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--accent);
  margin-bottom: 14px;
  display: flex;
  align-items: center;
  gap: 10px;
}
.section-label::before {
  content: '';
  width: 18px; height: 1px;
  background: var(--accent);
}

.section-title {
  font-family: 'Syne', sans-serif;
  font-size: clamp(32px, 5vw, 54px);
  font-weight: 800;
  letter-spacing: -0.03em;
  line-height: 1.05;
  margin-bottom: 16px;
}

.section-sub {
  font-size: 16px;
  color: var(--muted);
  max-width: 480px;
  line-height: 1.7;
  margin-bottom: 56px;
}

/* ── HOW IT WORKS ── */
.steps {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 2px;
  background: var(--border);
}

@media (max-width: 700px) { .steps { grid-template-columns: 1fr; } }

.step {
  background: var(--surface);
  padding: 36px 28px;
  transition: background 0.3s;
  position: relative;
  overflow: hidden;
}

.step::after {
  content: '';
  position: absolute;
  bottom: 0; left: 0; right: 0;
  height: 2px;
  background: linear-gradient(90deg, var(--accent), var(--accent2));
  transform: scaleX(0);
  transform-origin: left;
  transition: transform 0.4s;
}
.step:hover::after { transform: scaleX(1); }
.step:hover { background: var(--surface2); }

.step-num {
  font-family: 'Syne', sans-serif;
  font-size: 52px;
  font-weight: 800;
  color: var(--border);
  line-height: 1;
  margin-bottom: 20px;
  letter-spacing: -0.04em;
  transition: color 0.3s;
}
.step:hover .step-num { color: var(--accent); }

.step h3 {
  font-family: 'Syne', sans-serif;
  font-size: 18px;
  font-weight: 700;
  margin-bottom: 10px;
  letter-spacing: -0.02em;
}

.step p { font-size: 14px; color: var(--muted); line-height: 1.75; }

/* ── CHAT DEMO ── */
.demo-section {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 48px;
  align-items: center;
}

@media (max-width: 700px) {
  .demo-section { grid-template-columns: 1fr; }
}

.chat-window {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 4px;
  overflow: hidden;
  box-shadow: 0 20px 60px rgba(0,0,0,0.4);
}

.chat-top {
  background: var(--surface2);
  border-bottom: 1px solid var(--border);
  padding: 14px 18px;
  display: flex;
  align-items: center;
  gap: 10px;
}

.chat-dots { display: flex; gap: 6px; }
.chat-dots span { width: 10px; height: 10px; border-radius: 50%; }
.chat-dots span:nth-child(1) { background: #ff5f57; }
.chat-dots span:nth-child(2) { background: #ffbd2e; }
.chat-dots span:nth-child(3) { background: #28c840; }

.chat-title {
  font-size: 12px;
  font-weight: 600;
  color: var(--muted);
  letter-spacing: 0.08em;
  margin-left: 8px;
}

.chat-body {
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  min-height: 280px;
}

.bubble {
  padding: 11px 15px;
  font-size: 13px;
  line-height: 1.6;
  max-width: 82%;
  border-radius: 2px;
  opacity: 0;
  transform: translateY(8px);
}

.bubble-ai {
  background: rgba(0,240,255,0.07);
  border: 1px solid rgba(0,240,255,0.15);
  color: var(--text);
  align-self: flex-start;
}

.bubble-human {
  background: rgba(123,47,255,0.15);
  border: 1px solid rgba(123,47,255,0.25);
  color: var(--text);
  align-self: flex-end;
}

.bubble.show { opacity: 1; transform: none; transition: opacity 0.4s, transform 0.4s; }

.typing-indicator {
  display: flex;
  gap: 4px;
  padding: 12px 15px;
  background: rgba(0,240,255,0.04);
  border: 1px solid rgba(0,240,255,0.1);
  width: fit-content;
  border-radius: 2px;
  opacity: 0;
}
.typing-indicator.show { opacity: 1; }
.typing-indicator span {
  width: 5px; height: 5px;
  background: var(--accent);
  border-radius: 50%;
  animation: typingBounce 1.2s infinite;
  opacity: 0.5;
}
.typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
.typing-indicator span:nth-child(3) { animation-delay: 0.4s; }

@keyframes typingBounce {
  0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
  30% { transform: translateY(-5px); opacity: 1; }
}

.demo-text h3 {
  font-family: 'Syne', sans-serif;
  font-size: clamp(24px, 4vw, 36px);
  font-weight: 800;
  letter-spacing: -0.03em;
  margin-bottom: 16px;
  line-height: 1.1;
}

.demo-text p { font-size: 15px; color: var(--muted); line-height: 1.75; margin-bottom: 24px; }

.feature-list {
  list-style: none;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.feature-list li {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  font-size: 14px;
  color: var(--muted);
}

.feature-list li::before {
  content: '✦';
  color: var(--accent);
  font-size: 12px;
  flex-shrink: 0;
  margin-top: 2px;
}

/* ── SERVICES ── */
.services {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 2px;
  background: var(--border);
}

.service-card {
  background: var(--surface);
  padding: 36px 30px;
  position: relative;
  overflow: hidden;
  transition: background 0.3s;
}
.service-card:hover { background: var(--surface2); }

.service-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 2px;
  background: linear-gradient(90deg, var(--accent), var(--accent2));
  transform: scaleX(0);
  transform-origin: left;
  transition: transform 0.4s;
}
.service-card:hover::before { transform: scaleX(1); }

.service-icon {
  font-size: 28px;
  margin-bottom: 18px;
  display: block;
}

.service-card h3 {
  font-family: 'Syne', sans-serif;
  font-size: 19px;
  font-weight: 700;
  margin-bottom: 10px;
  letter-spacing: -0.02em;
}

.service-card p { font-size: 13px; color: var(--muted); line-height: 1.75; margin-bottom: 20px; }

.service-price {
  font-family: 'Syne', sans-serif;
  font-size: 26px;
  font-weight: 800;
  letter-spacing: -0.03em;
  background: linear-gradient(90deg, var(--accent), var(--accent2));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}
.service-price span { font-size: 13px; color: var(--muted); font-family: 'Instrument Sans', sans-serif; -webkit-text-fill-color: var(--muted); }

/* ── TESTIMONIALS ── */
.testi-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  gap: 16px;
}

.testi {
  background: var(--surface);
  border: 1px solid var(--border);
  padding: 28px;
  position: relative;
}

.testi::before {
  content: '"';
  position: absolute;
  top: 12px; right: 20px;
  font-size: 60px;
  color: var(--border);
  font-family: 'Syne', sans-serif;
  line-height: 1;
}

.stars { color: var(--accent); font-size: 13px; letter-spacing: 2px; margin-bottom: 14px; }
.testi p { font-size: 14px; color: #aaa; line-height: 1.75; font-style: italic; margin-bottom: 18px; }
.testi-name { font-weight: 600; font-size: 13px; }
.testi-role { font-size: 12px; color: var(--muted); }

/* ── PRICING ── */
.pricing-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  gap: 16px;
}

.price-card {
  background: var(--surface);
  border: 1px solid var(--border);
  padding: 36px 28px;
  position: relative;
  transition: transform 0.3s, border-color 0.3s;
}
.price-card:hover { transform: translateY(-4px); border-color: var(--accent); }

.price-card.featured {
  border-color: var(--accent);
  background: linear-gradient(135deg, #0c0c1a, #0a0a18);
}

.price-badge {
  position: absolute;
  top: -13px; left: 50%;
  transform: translateX(-50%);
  background: linear-gradient(90deg, var(--accent), var(--accent2));
  color: #000;
  font-family: 'Syne', sans-serif;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  padding: 4px 14px;
  white-space: nowrap;
}

.price-tier {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 16px;
}

.price-amount {
  font-family: 'Syne', sans-serif;
  font-size: 48px;
  font-weight: 800;
  letter-spacing: -0.04em;
  line-height: 1;
  margin-bottom: 6px;
}
.price-amount sup { font-size: 22px; vertical-align: top; margin-top: 10px; display: inline-block; }
.price-period { font-size: 12px; color: var(--muted); margin-bottom: 24px; }

.price-features {
  list-style: none;
  margin-bottom: 28px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.price-features li {
  font-size: 13px;
  color: #aaa;
  display: flex;
  align-items: center;
  gap: 10px;
}
.price-features li::before { content: '✓'; color: var(--accent); font-weight: 700; flex-shrink: 0; }

/* ── CTA SECTION ── */
.cta-section {
  position: relative;
  z-index: 1;
  background: var(--surface);
  border-top: 1px solid var(--border);
  border-bottom: 1px solid var(--border);
  padding: 100px 32px;
  text-align: center;
  overflow: hidden;
}

.cta-section::before {
  content: 'ZYNTRA';
  position: absolute;
  font-family: 'Syne', sans-serif;
  font-size: clamp(100px, 20vw, 220px);
  font-weight: 800;
  color: rgba(0,240,255,0.025);
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  white-space: nowrap;
  pointer-events: none;
  letter-spacing: -0.05em;
}

.cta-inner { max-width: 600px; margin: 0 auto; }

.cta-section h2 {
  font-family: 'Syne', sans-serif;
  font-size: clamp(34px, 7vw, 64px);
  font-weight: 800;
  letter-spacing: -0.04em;
  line-height: 1.05;
  margin-bottom: 20px;
}

.cta-section h2 span {
  background: linear-gradient(90deg, var(--accent), var(--accent2));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

.cta-section p { font-size: 16px; color: var(--muted); margin-bottom: 40px; line-height: 1.7; }

/* FORM */
.contact-form {
  display: flex;
  flex-direction: column;
  gap: 10px;
  text-align: left;
}

.form-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}
@media (max-width: 500px) { .form-row { grid-template-columns: 1fr; } }

.form-input {
  background: rgba(255,255,255,0.04);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 13px 16px;
  font-family: 'Instrument Sans', sans-serif;
  font-size: 14px;
  width: 100%;
  outline: none;
  transition: border-color 0.2s, background 0.2s;
  border-radius: 2px;
}
.form-input:focus {
  border-color: var(--accent);
  background: rgba(0,240,255,0.04);
}
.form-input::placeholder { color: #444; }

.form-submit {
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  color: #000;
  border: none;
  padding: 15px;
  font-family: 'Syne', sans-serif;
  font-weight: 700;
  font-size: 13px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  width: 100%;
  border-radius: 2px;
  transition: opacity 0.2s, transform 0.2s;
}
.form-submit:hover { opacity: 0.9; transform: translateY(-1px); }

.form-note { font-size: 11px; color: var(--muted); text-align: center; margin-top: 6px; letter-spacing: 0.04em; }

.success-msg {
  display: none;
  background: rgba(0,240,255,0.07);
  border: 1px solid rgba(0,240,255,0.2);
  color: var(--accent);
  padding: 16px;
  font-size: 14px;
  text-align: center;
  border-radius: 2px;
}

/* ── FOOTER ── */
footer {
  position: relative;
  z-index: 1;
  background: var(--bg);
  border-top: 1px solid var(--border);
  padding: 36px 32px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 12px;
}

.footer-logo {
  font-family: 'Syne', sans-serif;
  font-weight: 800;
  font-size: 18px;
  letter-spacing: 0.08em;
}
.footer-logo span {
  background: linear-gradient(90deg, var(--accent), var(--accent2));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}
